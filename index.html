</div>

const L = 360, C = 180, RR = 158, TAU = Math.PI * 2, DEG = Math.PI / 180;
const dpr = Math.min(3, window.devicePixelRatio || 1);
function fit(cv, size) { cv.width = cv.height = size * dpr; const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.lineCap = c.lineJoin = 'round'; return c; }
const cv = $('#cv'), g = fit(cv, L);
const lay = document.createElement('canvas'), lg = fit(lay, L);
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  c.beginPath(); c.moveTo(x1, y1); c.quadraticCurveTo((x1 + x2) / 2 - dy / l * o, (y1 + y2) / 2 + dx / l * o, x2, y2); c.stroke(); }
function poly(c, pts, close) { for (let i = 0; i < pts.length - 1; i++) ln(c, pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1]); if (close) ln(c, pts[pts.length - 1][0], pts[pts.length - 1][1], pts[0][0], pts[0][1]); }
function ring(c, x, y, r) { c.beginPath(); c.ellipse(x, y, r, r * .988, .3, 0, TAU); c.stroke(); c.save(); c.globalAlpha *= .4; c.beginPath(); c.ellipse(x + .5, y - .4, r * .992, r, 1.1, 0, TAU); c.stroke(); c.restore(); }

    p.forEach(([x, y]) => { c.save(); c.fillStyle = BG; c.beginPath(); c.arc(x, y, .16, 0, TAU); c.fill(); c.stroke(); c.restore(); }); },
};
'BUKETDIANOPR'.split('').forEach(ch => PIECE['L' + ch] = letter(ch));
const TRAY = { moon: ['LB', 'LU', 'LK', 'LE', 'LT', 'LD', 'LI', 'LA', 'LN', 'crescent', 'claw', 'bouquet', 'bow'],
               earth: ['LT', 'LO', 'LP', 'LR', 'LA', 'LK', 'earth', 'cat', 'glasses', 'node'] };
function drawSigil(c, list, cx, cy, R, col, lw) {
  if (!list) return;
  for (const o of list) { c.save(); c.translate(cx + o.x * R, cy + o.y * R); c.rotate(o.rot); const s = o.sc * R; c.scale(s, s); c.lineWidth = lw / s; c.strokeStyle = col; PIECE[o.p](c); c.restore(); }

const EMB = {
  lir(c) { c.beginPath(); c.moveTo(-.5, .8); c.bezierCurveTo(-1, 0, -.6, -.6, -.5, -.9); c.moveTo(.5, .8); c.bezierCurveTo(1, 0, .6, -.6, .5, -.9); c.moveTo(-.55, -.6); c.lineTo(.55, -.6); c.moveTo(-.5, .8); c.lineTo(.5, .8);

    c.beginPath(); c.arc(-.8, .1, .2, 0, Math.PI); c.stroke(); c.beginPath(); c.arc(.8, .1, .2, 0, Math.PI); c.stroke(); },
};
function emb(c, k, x, y, s, col) { c.save(); c.translate(x, y); c.scale(s, s); c.lineWidth = 1.2 / s; c.strokeStyle = col; EMB[k](c); c.restore(); }

const TX = {
